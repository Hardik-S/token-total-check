name: CI

on:
  push:
    branches: [main]
    tags: ["v*", "[0-9]*"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build and install a non-editable wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
          python -m pip install --no-deps dist/token_total_check-0.1.0-py3-none-any.whl
      - name: Run full suite (zero skipped)
        run: python -m unittest discover -s tests -v
      - name: Check installed package and console script outside the source tree
        run: python acceptance.py
